<!-- Floating contact widget: button + modal with name/email/description form -->
{% assign contact_endpoint = site.contact.endpoint | default: '' %}

<style>
  .bt-contact-fab {
    position: fixed;
    right: 20px;
    bottom: 84px;
    z-index: 1040;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  /* Lift the theme's back-to-top button above the Hire me FAB and Calendly badge */
  #back-to-top { bottom: 154px !important; }
  .bt-contact-fab.is-visible { display: inline-flex; }
  .bt-contact-fab:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(37, 99, 235, 0.45);
  }
  .bt-contact-fab svg { width: 18px; height: 18px; }

  .bt-contact-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(2px);
    z-index: 1050;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .bt-contact-backdrop.is-open { display: flex; }

  .bt-contact-modal {
    position: relative;
    background: #fff;
    color: #0f172a;
    border-radius: 14px;
    width: 100%;
    max-width: 820px;
    max-height: calc(100vh - 24px);
    display: flex;
    flex-direction: row;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(2, 6, 23, 0.35);
    transform: translateY(8px);
    opacity: 0;
    transition: transform 0.18s ease, opacity 0.18s ease;
  }
  @media (max-width: 640px) {
    .bt-contact-modal { flex-direction: column; max-width: 420px; }
  }
  .bt-contact-backdrop.is-open .bt-contact-modal {
    transform: translateY(0);
    opacity: 1;
  }

  .bt-contact-modal__header {
    line-height: 0;
    flex: 0 0 380px;
    background: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bt-contact-modal__header img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }
  @media (max-width: 640px) {
    .bt-contact-modal__header { flex: 0 0 auto; }
  }
  .bt-contact-modal__close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 999px;
    border: none;
    background: rgba(255, 255, 255, 0.9);
    color: #0f172a;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .bt-contact-modal__body {
    padding: 12px 20px 16px;
    overflow-y: auto;
    flex: 1 1 auto;
  }
  .bt-contact-modal__body h3 {
    margin: 0 0 2px;
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.25;
  }
  .bt-contact-modal__body p {
    margin: 0 0 8px;
    color: #475569;
    font-size: 0.85rem;
  }

  .bt-contact-form label {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: #334155;
    margin-bottom: 2px;
  }
  .bt-contact-form .bt-field { margin-bottom: 6px; }
  .bt-contact-form input,
  .bt-contact-form textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.9rem;
    background: #fff;
    color: #0f172a;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .bt-contact-form input:focus,
  .bt-contact-form textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
  }
  .bt-contact-form textarea { resize: vertical; min-height: 44px; }

  .bt-contact-submit {
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    margin-top: 2px;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .bt-contact-submit:hover:not(:disabled) { background: #1d4ed8; }
  .bt-contact-submit:disabled { opacity: 0.65; cursor: not-allowed; }

  .bt-contact-socials__sep {
    color: #cbd5e1;
    font-size: 0.85rem;
    margin: 0 2px;
  }
  .bt-contact-socials a.bt-contact-socials__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: auto;
    height: 32px;
    padding: 0 12px;
    border-radius: 999px;
    background: #2563eb;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .bt-contact-socials a.bt-contact-socials__btn:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
  }
  .bt-contact-socials a.bt-contact-socials__btn svg { width: 14px; height: 14px; }

  .bt-contact-status {
    margin-top: 8px;
    font-size: 0.85rem;
    min-height: 1.2em;
  }
  .bt-contact-status.is-error { color: #b91c1c; }
  .bt-contact-status.is-success { color: #047857; }

  .bt-contact-socials {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .bt-contact-socials__label {
    font-size: 0.78rem;
    color: #64748b;
    margin-right: 2px;
  }
  .bt-contact-socials a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #f1f5f9;
    color: #0f172a;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .bt-contact-socials a:hover {
    background: #e2e8f0;
    transform: translateY(-1px);
  }
  .bt-contact-socials svg { width: 16px; height: 16px; }

  @media (prefers-color-scheme: dark) {
    .bt-contact-modal { background: #0f172a; color: #e2e8f0; }
    .bt-contact-modal__body p { color: #94a3b8; }
    .bt-contact-form label { color: #cbd5e1; }
    .bt-contact-form input,
    .bt-contact-form textarea {
      background: #1e293b;
      border-color: #334155;
      color: #f1f5f9;
    }
    .bt-contact-modal__close { background: rgba(15, 23, 42, 0.9); color: #f1f5f9; }
    .bt-contact-socials { border-top-color: #1e293b; }
    .bt-contact-socials__label { color: #94a3b8; }
    .bt-contact-socials a { background: #1e293b; color: #e2e8f0; }
    .bt-contact-socials a:hover { background: #334155; }
    .bt-contact-socials__sep { color: #475569; }
    .bt-contact-socials a.bt-contact-socials__btn { background: #3b82f6; color: #fff; }
    .bt-contact-socials a.bt-contact-socials__btn:hover { background: #2563eb; }
  }
</style>

<button type="button" class="bt-contact-fab" id="bt-contact-open" aria-label="Open contact form">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
  Drop a message
</button>

<div class="bt-contact-backdrop" id="bt-contact-backdrop" role="dialog" aria-modal="true" aria-labelledby="bt-contact-title" hidden>
  <div class="bt-contact-modal">
    <div class="bt-contact-modal__header">
      <img src="{{ '/assets/img/arman-banner-square.jpg' | relative_url }}" alt="Arman — available for freelance & contract scraping, data extraction, and ETL pipelines">
      <button type="button" class="bt-contact-modal__close" id="bt-contact-close" aria-label="Close">&times;</button>
    </div>
    <div class="bt-contact-modal__body">
      <h3 id="bt-contact-title">Tell me about your project</h3>
      <p>Drop a quick note and I'll get back to you by email.</p>
      <form class="bt-contact-form" id="bt-contact-form" novalidate>
        <div class="bt-field">
          <label for="bt-contact-name">Name</label>
          <input type="text" id="bt-contact-name" name="name" required autocomplete="name">
        </div>
        <div class="bt-field">
          <label for="bt-contact-email">Email</label>
          <input type="email" id="bt-contact-email" name="email" required autocomplete="email">
        </div>
        <div class="bt-field">
          <label for="bt-contact-message">Project description</label>
          <textarea id="bt-contact-message" name="description" required rows="4"></textarea>
        </div>
        <button type="submit" class="bt-contact-submit" id="bt-contact-submit">Send message</button>
        <div class="bt-contact-status" id="bt-contact-status" role="status" aria-live="polite"></div>
      </form>
      <div class="bt-contact-socials">
        <a href="https://twitter.com/armanfixing" target="_blank" rel="noopener" aria-label="X (Twitter)" title="X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <a href="https://www.linkedin.com/in/armanhossain" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/></svg>
        </a>
        <span class="bt-contact-socials__label">or</span>
        <a href="https://calendly.com/armanfixing/30min" id="bt-contact-calendly" class="bt-contact-socials__btn" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Book a 30-min call
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    var endpoint = {{ contact_endpoint | jsonify }};
    var backdrop = document.getElementById('bt-contact-backdrop');
    var openBtn = document.getElementById('bt-contact-open');
    var closeBtn = document.getElementById('bt-contact-close');
    var form = document.getElementById('bt-contact-form');
    var submitBtn = document.getElementById('bt-contact-submit');
    var status = document.getElementById('bt-contact-status');

    var hasBeenClosed = false;
    var DISMISS_COOKIE = 'bt-contact-dismissed';
    var DISMISS_HOURS = 24;

    function setDismissCookie() {
      var expires = new Date(Date.now() + DISMISS_HOURS * 60 * 60 * 1000).toUTCString();
      document.cookie = DISMISS_COOKIE + '=1; expires=' + expires + '; path=/; SameSite=Lax';
    }
    function isDismissed() {
      return document.cookie.split('; ').indexOf(DISMISS_COOKIE + '=1') !== -1;
    }

    function open() {
      backdrop.hidden = false;
      requestAnimationFrame(function () { backdrop.classList.add('is-open'); });
      document.body.style.overflow = 'hidden';
      setTimeout(function () { document.getElementById('bt-contact-name').focus(); }, 80);
    }
    function close() {
      backdrop.classList.remove('is-open');
      document.body.style.overflow = '';
      setTimeout(function () { backdrop.hidden = true; }, 180);
      status.textContent = '';
      status.className = 'bt-contact-status';
      if (!hasBeenClosed) {
        hasBeenClosed = true;
        openBtn.classList.add('is-visible');
        try { setDismissCookie(); } catch (e) {}
      }
    }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);

    var calendlyBtn = document.getElementById('bt-contact-calendly');
    if (calendlyBtn) {
      calendlyBtn.addEventListener('click', function (e) {
        if (window.Calendly && typeof Calendly.initPopupWidget === 'function') {
          e.preventDefault();
          Calendly.initPopupWidget({ url: 'https://calendly.com/armanfixing/30min' });
        }
      });
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && backdrop.classList.contains('is-open')) close();
    });

    var dismissed = false;
    try { dismissed = isDismissed(); } catch (e) {}
    if (dismissed) {
      hasBeenClosed = true;
      openBtn.classList.add('is-visible');
    } else {
      setTimeout(open, 3000);
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      status.className = 'bt-contact-status';
      status.textContent = '';

      var name = form.name.value.trim();
      var email = form.email.value.trim();
      var description = form.description.value.trim();

      if (!name || !email || !description) {
        status.textContent = 'Please fill in all fields.';
        status.classList.add('is-error');
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        status.textContent = 'Please enter a valid email address.';
        status.classList.add('is-error');
        return;
      }
      if (!endpoint) {
        status.textContent = 'Contact endpoint not configured yet.';
        status.classList.add('is-error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, email: email, description: description })
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            if (!res.ok) throw new Error(data.error || 'submit failed');
            return data;
          });
        })
        .then(function () {
          status.textContent = 'Thanks — message sent. I\'ll reply by email shortly.';
          status.classList.add('is-success');
          form.reset();
          setTimeout(close, 2200);
        })
        .catch(function (err) {
          status.textContent = (err && err.message) ? err.message : 'Something went wrong. Please try again.';
          status.classList.add('is-error');
        })
        .finally(function () {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send message';
        });
    });
  })();
</script>
